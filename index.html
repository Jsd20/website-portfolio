<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f2eb">
  <meta name="description" content="Il portfolio di siti web di Jsd20. Esplora Brasca, un ristorante immaginario tra le colline del Chianti.">
  <title>Website portfolio · Jsd20</title>
  <style>
    :root {background:#f5f2eb;color:#23231e;font-family:Arial,Helvetica,sans-serif}
    * {box-sizing:border-box}
    body {margin:0 auto;width:min(90%,1300px)}
    header,footer {display:flex;align-items:center;justify-content:space-between;gap:1rem}
    header {padding:1.55rem 0;border-bottom:1px solid #c9c4b8}
    .signature {font:600 1.15rem/1.3 monospace;letter-spacing:-.05em}
    a {color:inherit;text-underline-offset:.25em}
    a:focus-visible {outline:3px solid #b94724;outline-offset:5px}
    header a,footer {font-size:.875rem}
    h1 {font:400 clamp(3.2rem,8vw,7.5rem)/.95 Georgia,serif;letter-spacing:-.075em;margin:clamp(2.5rem,5vw,5rem) 0}
    .project {display:grid;grid-template-columns:1.5fr 1fr;background:#25261e;color:#f8f3e8;text-decoration:none}
    .photo {overflow:hidden;min-height:320px}
    .photo img {display:block;width:100%;height:100%;object-fit:cover;object-position:70% 50%;transition:transform .65s ease}
    .project:hover img {transform:scale(1.025)}
    .copy {align-self:center;padding:clamp(1.8rem,4vw,4.2rem)}
    .category {font-size:.75rem;line-height:1.5;letter-spacing:.13em;text-transform:uppercase;color:#e8bc9e}
    h2 {font:400 clamp(3rem,5.5vw,6rem)/1 Georgia,serif;letter-spacing:-.06em;margin:.55rem 0 1rem}
    p {font-size:1.04rem;line-height:1.65;color:#eee8db;margin:0 0 1.8rem}
    .visit {text-decoration:underline;text-underline-offset:.35em}
    footer {padding:1.5rem 0;color:#57584c}
    @media(max-width:680px){.project {grid-template-columns:1fr}.photo {height:230px;min-height:0}}
    @media(prefers-reduced-motion:reduce){.photo img {transition:none}.project:hover img{transform:none}}
  </style>
</head>
<body>
  <header><span class="signature">Jsd20</span><a href="https://github.com/Jsd20/website-portfolio">Repository GitHub</a></header>
  <main>
    <h1>Website portfolio</h1>
    <a class="project" href="./brasca/" aria-label="Visita il sito di Brasca">
      <div class="photo"><img src="./brasca/assets/hearth.jpg" width="1962" height="801" alt="Verdure che cuociono sulla brace in una padella di ferro"></div>
      <div class="copy"><span class="category">Ristorazione · Toscana</span><h2>Brasca</h2><p>Un ristorante immaginario nel Chianti, tra cucina alla brace, pasta tirata a mano e vini toscani.</p><span class="visit">Visita il sito</span></div>
    </a>
  </main>
  <footer>Portfolio di Jsd20</footer>
</body>
</html>
